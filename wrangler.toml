# Optional production gate (1.4.1+). When REQUIRE_TOKEN=1, GET /v1/ready is 503
# unless secret RUNTIME_TOKEN is set (`npx wrangler secret put RUNTIME_TOKEN`).
# Catalog / health / runtime / skill / pull / OpenAPI / MCP tools/list stay public.
# Session mutate (open/policy/exec/close) requires Authorization: Bearer … or
# X-Aziel-Runtime-Token only when REQUIRE_TOKEN=1 (one operator token).
[vars]
REQUIRE_TOKEN = "1"
# GIT_SHA is injected at deploy (`wrangler deploy --var GIT_SHA:$(git rev-parse HEAD)`).
# Actions already passes github.sha. Catalog falls back to src/build-meta.js when unbound.

[version_metadata]
binding = "CF_VERSION_METADATA"

# One Durable Object per session (open → policy → exec → receipt → close).
# 1.4.0 engines run in this Worker isolate; no new DO class. 1.4.1 / 1.5.0 / 1.6.0 / 1.6.1 / 1.6.2 / 1.6.3 / 1.6.4 / 1.6.5 / 1.6.6 / 1.6.7 / 1.6.8 / 1.6.9 / 1.6.10 / 1.6.11 / 1.6.12 / 1.6.13 / 1.6.14 / 1.6.15 / 1.7.0 / 1.9.1 reuse SESSION.
# Browser Rendering next step (not bound — Chromium stays DEFERRED):
# [browser]
# binding = "BROWSER"
# Then: npm i @cloudflare/puppeteer  — do not fake Chromium; Tor/phoenix stay refuse.
[[durable_objects.bindings]]
name = "SESSION"
class_name = "RuntimeSession"

# API use counters + ring log (1.6.3). Distinct from product download-trackers.
# 1.6.13 QNM suite rollup also stores here under mesh| keys when MESH is unbound
# (never invent placeholder 0000… KV ids).
# Production namespace on account ac575a9b822bea2bed97d0ab73aed238.
[[kv_namespaces]]
binding = "USES"
id = "c1f89ba6f1db47328d36379cdd69b7ab"

# AZMail anonymous mesh ring (1.6.5). Distinct from USES.
# Production namespace on account ac575a9b822bea2bed97d0ab73aed238.
[[kv_namespaces]]
binding = "AZMAIL_MESH"
id = "ce81cecf8b75412fb7b56e1119e017da"

# AZBrowser tabs + receipts (1.6.6). Distinct from USES / AZMAIL_MESH.
# Production namespace on account ac575a9b822bea2bed97d0ab73aed238.
[[kv_namespaces]]
binding = "AZBROWSER_TABS"
id = "7487aba1bbb5417fb668de86d8b48f37"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RuntimeSession"]

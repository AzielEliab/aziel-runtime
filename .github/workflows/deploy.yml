# Deploy aziel-runtime to Cloudflare Workers.
# Primary deploy is Cursor/wrangler OAuth (Aziel Eliab). Actions is optional
# backup and runs only when CLOUDFLARE_API_TOKEN is set — otherwise this job
# is skipped (not failed) so missing secrets do not send failure emails.
# Account id ac575a9b822bea2bed97d0ab73aed238 is the non-secret default
# (also in wrangler.toml). Do not invent or commit tokens.
# Author: Aziel Eliab. Identity is Aziel Eliab only.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Skipping Actions deploy: CLOUDFLARE_API_TOKEN is not set."
            echo "Primary deploy is Cursor/wrangler OAuth (Aziel Eliab)."
            echo "Actions is optional backup and runs only when CLOUDFLARE_API_TOKEN is set."
            echo "Do not invent tokens. Do not commit tokens."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Cloudflare API token is present (value not printed)."
          echo "Account id default: ac575a9b822bea2bed97d0ab73aed238 when CLOUDFLARE_ACCOUNT_ID is unset."

      - name: Deploy Worker
        if: steps.secrets.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'ac575a9b822bea2bed97d0ab73aed238' }}
        run: npx --yes wrangler deploy --var GIT_SHA:${{ github.sha }}

# Deploy aziel-runtime to Cloudflare Workers.
# Primary deploy is Cursor/wrangler OAuth (Aziel Eliab). Actions is optional
# backup. Do not use secrets in job-level `if:` — GitHub rejects that
# ("Unrecognized named-value: 'secrets'") and marks the workflow as a
# "workflow file issue" (fails in 0s, still emails). Map the token into
# job env and gate steps instead. When the token is unset, only the
# skip-notice step runs and exits 0 (workflow success, no failure email).
# Account id ac575a9b822bea2bed97d0ab73aed238 is the non-secret default
# (also in wrangler.toml). Do not invent or commit tokens.
# Author: Aziel Eliab. Identity is Aziel Eliab only.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip notice when token unset
        if: ${{ env.HAS_CF_TOKEN == '' }}
        run: |
          echo "Skipping Actions deploy: CLOUDFLARE_API_TOKEN unset."
          echo "Primary deploy is Cursor/wrangler OAuth (Aziel Eliab)."
          echo "No failure — optional backup only."

      - name: Checkout
        if: ${{ env.HAS_CF_TOKEN != '' }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ env.HAS_CF_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy Worker
        if: ${{ env.HAS_CF_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'ac575a9b822bea2bed97d0ab73aed238' }}
        run: npx --yes wrangler deploy --var GIT_SHA:${{ github.sha }}

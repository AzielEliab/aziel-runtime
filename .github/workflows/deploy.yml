# Deploy aziel-runtime to Cloudflare Workers on push to main.
# Secrets (repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID   (account ac575a9b822bea2bed97d0ab73aed238)
# Do not put real tokens in this repository.
# Author: Aziel Eliab. Identity is Aziel Eliab only.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing."
            echo "Add it in GitHub → Settings → Secrets and variables → Actions."
            echo "Do not invent tokens. Do not commit tokens."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is missing."
            echo "Expected Cloudflare account ac575a9b822bea2bed97d0ab73aed238."
            echo "Add it in GitHub → Settings → Secrets and variables → Actions."
            echo "Do not invent tokens. Do not commit tokens."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Deploy refused: Cloudflare secrets are not configured."
            exit 1
          fi
          echo "Cloudflare secrets are present (values not printed)."

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy --var GIT_SHA:${{ github.sha }}

# AZRT-WITNESS-QUORUM-1.0 slot 2 on Codeberg (Forgejo Actions). Not GitHub, not Cloudflare.
name: witness2
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Anchor even if heads are unchanged"
        default: "0"
concurrency:
  group: witness2-log
  cancel-in-progress: false
jobs:
  anchor:
    runs-on: codeberg-tiny
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign and anchor runtime heads (key lives only in this repo's Actions secret)
        env:
          WITNESS2_ED25519_PKCS8: ${{ secrets.WITNESS2_ED25519_PKCS8 }}
          WITNESS2_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
        run: node scripts/witness2.mjs
      - name: Commit anchor log (append-only)
        run: |
          git config user.name "aziel-witness2"
          git config user.email "aziel-witness2@noreply.codeberg.org"
          git add anchors
          git diff --cached --quiet && exit 0
          git commit -m "witness2: $(tail -1 anchors/log.jsonl | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log("n="+r.statement.n+" "+r.statement_hash.slice(0,16))})')"
          git pull --rebase origin main && git push origin HEAD:main

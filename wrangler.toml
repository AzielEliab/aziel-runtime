# Optional production gate (1.4.1+). When REQUIRE_TOKEN=1, GET /v1/ready is 503
# unless secret RUNTIME_TOKEN is set (`npx wrangler secret put RUNTIME_TOKEN`).
# Catalog / health / runtime / skill / pull / OpenAPI / MCP tools/list stay public.
# Session mutate (open/policy/exec/close) requires Authorization: Bearer … or
# X-Aziel-Runtime-Token only when REQUIRE_TOKEN=1 (one operator token).
# Token is header-only — never query, JSON body, MCP args, [vars], or git.
# ACT-RECEIPT-1.0: optional secret RECEIPT_APPEND_TOKEN (`npx wrangler secret put
# RECEIPT_APPEND_TOKEN`). When set, FragGate list/call, POST /mcp, and significant
# POST /v1/* append four-field receipts to corpus /v1/receipts/append (header
# x-aziel-receipt). Missing token is fail-open — engines still work. Not a
# Softwares-tab product. Do not put the token in [vars].
[vars]
REQUIRE_TOKEN = "1"
# GIT_SHA is injected at deploy (`wrangler deploy --var GIT_SHA:$(git rev-parse HEAD)`).
# Actions already passes github.sha. Catalog falls back to src/build-meta.js when unbound.

[version_metadata]
binding = "CF_VERSION_METADATA"

# One Durable Object per session (open → policy → exec → receipt → close).
# 1.4.0 engines run in this Worker isolate. 1.4.1–2.0.0-rc1 reuse SESSION.
# F01: CHAINLOCK / ChainWriter is a second class — serialized append per chain.
# F03: RATE / RateQuota is a third class — distributed sliding window per IP+bucket.
# 1.9.2: Workers Browser Rendering for AZBrowser sandbox_status / sandbox_render.
# Do not fake Chromium when unbound; Tor / phoenix stay refuse.
[browser]
binding = "BROWSER"

# 1.9.2: Workers AI for Whisper / OCR honesty (native only when env.AI.run is present).
[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "RuntimeSession"

# F01 concurrent append writer. One object per chain (getByName).
# FragGate ledger uses name "fraggate". ChainLock roster uses the chain name.
# Individual records + transactional seq/tip. Not OAuth. Not a public ledger.
[[durable_objects.bindings]]
name = "CHAINLOCK"
class_name = "ChainWriter"

# F03 door quotas. One object per bucket:ip (getByName). Isolate fallback when unbound.
# Not OAuth. Not a public ledger. MemoryStore is not this quota.
[[durable_objects.bindings]]
name = "RATE"
class_name = "RateQuota"

# AZVPN concentrator (application-layer HTTPS/WS sessions). One object name "azvpn".
# Serialized like ChainWriter. Isolate memory fallback when unbound.
[[durable_objects.bindings]]
name = "TUNNEL"
class_name = "TunnelHub"

# API use counters + ring log (1.6.3). Distinct from product download-trackers.
# 1.6.13 QNM suite rollup also stores here under mesh| keys when MESH is unbound
# (never invent placeholder 0000… KV ids).
# Production namespace on account ac575a9b822bea2bed97d0ab73aed238.
[[kv_namespaces]]
binding = "USES"
id = "c1f89ba6f1db47328d36379cdd69b7ab"

# AZMail anonymous mesh ring (1.6.5). Distinct from USES.
# Production namespace on account ac575a9b822bea2bed97d0ab73aed238.
[[kv_namespaces]]
binding = "AZMAIL_MESH"
id = "ce81cecf8b75412fb7b56e1119e017da"

# AZBrowser tabs + receipts (1.6.6). Distinct from USES / AZMAIL_MESH.
# Production namespace on account ac575a9b822bea2bed97d0ab73aed238.
[[kv_namespaces]]
binding = "AZBROWSER_TABS"
id = "7487aba1bbb5417fb668de86d8b48f37"

# 1.9.2: live Aziel Digital Library MASTER. Production table is `records` (not `master`).
# Sample MASTER remains the unbound fallback. Search SQL is in src/engines/aziel-corpus/engine.js.
[[d1_databases]]
binding = "CORPUS_D1"
database_name = "aziel-digital-library"
database_id = "23f33238-f1ca-4066-b56e-af66a1e72031"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RuntimeSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ChainWriter"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RateQuota"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["TunnelHub"]

service = "godlock-download-tracker"

[[services]]
binding = "SHADOWLOCK"
service = "shadowlock-download-tracker"

[[services]]
binding = "TEMPORALLOCK"
service = "temporallock-download-tracker"

[[services]]
binding = "FORGERECEIPTS"
service = "forgereceipts-download-tracker"

[[services]]
binding = "DECISIONGATE"
service = "decisiongate-download-tracker"

[[services]]
binding = "ZSOLVER"

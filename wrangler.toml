name = "aziel-runtime"
main = "src/index.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "ac575a9b822bea2bed97d0ab73aed238"

[observability]
enabled = true
head_sampling_rate = 1

# QNM suite-presence fan-out while operator-enabled. GET /v1/mesh never enables.
# Refresh is well under the 5-minute presence TTL. Radios stay OFF until a bearer.
[triggers]
crons = ["*/2 * * * *"]

[assets]
